services:
  api:
    build: .
    image: data-center-server:latest
    restart: always
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # Production defaults; override them in `.env`.
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      POLARS_ENGINE: ${POLARS_ENGINE:-gpu}
    # Requires the NVIDIA driver and NVIDIA Container Toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Same GPU request in the form accepted by toolkits configured with
      # accept-nvidia-visible-devices-envvar-when-unprivileged = false (common on Kubernetes hosts).
      # Default toolkit setups ignore it and use the reservation above.
      - /dev/null:/var/run/nvidia-container-devices/all:ro
    # Let in-flight file jobs finish on redeploy before the container is killed.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
